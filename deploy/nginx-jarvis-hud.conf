# Jarvis HUD reverse proxy — HTTPS + WebSocket to Jarvis on 127.0.0.1:8765
# Install:
#   sudo cp deploy/nginx-jarvis-hud.conf /etc/nginx/sites-available/jarvis-hud
#   sudo ln -sf /etc/nginx/sites-available/jarvis-hud /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d YOUR-HUD-DOMAIN.example.com
# Edit server_name and ssl_certificate paths before enabling.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-HUD-DOMAIN.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR-HUD-DOMAIN.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/YOUR-HUD-DOMAIN.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HUD-DOMAIN.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:JARVIS:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 10m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
