# Nginx locations for Sunny reports hub (add to production edge server block)
# Include after existing /reports/ and /reports-manifest.json blocks.

    location = /test-catalog.html {
        root /var/www/sunny;
        try_files /test-catalog.html =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /test-catalog.json {
        root /var/www/sunny;
        try_files /test-catalog.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /artifacts-manifest.json {
        root /var/www/sunny;
        try_files /artifacts-manifest.json =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /reports-shared.css {
        root /var/www/sunny;
        try_files /reports-shared.css =404;
        add_header Cache-Control "no-cache" always;
    }

    location /artifacts/ {
        root /var/www/sunny;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }
