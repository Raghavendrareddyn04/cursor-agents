apiVersion: v1
kind: Namespace
metadata:
  name: sunny-prod
  labels:
    app.kubernetes.io/part-of: sunny
    environment: production
    # Pod Security Admission — production namespace gets the "restricted" profile.
    # K8s 1.25+ enforces these automatically; on older clusters the label is ignored but
    # nothing breaks. Required because production pods must not run as root or mount host paths.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: sunny
    environment: production
    # Observability is allowed "baseline" — Prometheus and Grafana need hostPath volumes and
    # some run as root to bind privileged ports. NOT restricted.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
