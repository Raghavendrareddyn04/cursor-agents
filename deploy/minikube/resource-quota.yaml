apiVersion: v1
kind: ResourceQuota
metadata:
  name: sunny-prod-quota
  namespace: sunny-prod
  annotations:
    # Rajesh MUST tune these to host capacity (nproc, free -g) — the defaults below
    # assume a 4-vCPU / 8-GiB VPS hosting Minikube itself plus 1 gateway + 2–3
    # microservices + observability. On a smaller host, scale down to:
    #   requests.cpu: "4", requests.memory: "8Gi", limits.cpu: "6", limits.memory: "12Gi"
    # On a 8-vCPU / 16-GiB host, scale up to:
    #   requests.cpu: "12", requests.memory: "24Gi", limits.cpu: "20", limits.memory: "40Gi"
    # Never set requests > host capacity — the scheduler will fail every pod.
    sunny.example/host-tuning-guide: "See deploy/README.md for the sizing table."
spec:
  hard:
    pods: "20"
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "12"
    limits.memory: 24Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sunny-prod-limits
  namespace: sunny-prod
spec:
  limits:
    - default:
        cpu: 500m
        memory: 768Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      type: Container
