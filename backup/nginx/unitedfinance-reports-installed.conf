# Reports-only nginx config for unitedfinance.qualityoutsidethebox.org
# Serves .sunny/web static artifacts — no frontend/backend proxy.
# Install: cp to /etc/nginx/sites-available/unitedfinance-reports

# HTTP: ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name unitedfinance.qualityoutsidethebox.org;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: static reports only
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name unitedfinance.qualityoutsidethebox.org;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/unitedfinance.qualityoutsidethebox.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/unitedfinance.qualityoutsidethebox.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:UFSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 10m;

    gzip on;
    gzip_types application/json text/css application/javascript text/plain application/xml text/markdown;
    gzip_min_length 512;

    # Root redirect → reports dashboard
    location = / {
        return 301 /reports.html;
    }

    location = /reports.html {
        alias /opt/arcadian-wealth/.sunny/web/reports.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /agentprogress.html {
        alias /opt/arcadian-wealth/.sunny/web/agentprogress.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location = /progress.json {
        alias /opt/arcadian-wealth/.sunny/web/progress.json;
        add_header Cache-Control "no-cache" always;
        add_header Content-Type "application/json" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location /reports/ {
        alias /opt/arcadian-wealth/.sunny/web/reports/;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        types {
            text/html                             html htm;
            text/css                              css;
            text/javascript                       js;
            application/javascript                mjs;
            text/markdown                         md;
            text/plain                            log;
            application/json                      json;
            image/png                             png;
            image/svg+xml                         svg svgz;
            image/gif                             gif;
            image/jpeg                            jpeg jpg;
            application/xml                       xml;
            application/vnd.android.package-archive apk;
        }
    }

    # App routes not hosted during Docker transition
    location /api/ {
        return 404;
    }
    location /auth {
        return 404;
    }
    location /v3/api-docs {
        return 404;
    }
    location /swagger-ui/ {
        return 404;
    }

    location / {
        return 404;
    }
}
